// Lootr More Compat (1.21.1 NeoForge) 构建与运行配置
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 必选核心依赖：Lootr 1.21.1 NeoForge
    implementation "maven.modrinth:lootr:SPOrIzX8"

    // 可选联动模组（仅开发编译与实机测试挂载，不写入 neoforge.mods.toml）
    implementation "curse.maven:aether-255308:7043502"
    runtimeOnly "maven.modrinth:owo-lib:wbdHEItB"
    implementation "curse.maven:the-twilight-forest-227639:7797302"

    implementation "curse.maven:jei-238222:8792638"
    // Just Enough Characters 为客户端专用模组，runServer 时自动排除以避免专用服务端加载失败
    if (!gradle.startParameter.taskNames.any { it.toLowerCase().contains('server') }) {
        implementation "curse.maven:just-enough-characters-250702:8117474"
    }
    implementation "curse.maven:jade-324717:8591319"
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version: project.neo_version,
            neo_version_range: project.neo_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
